name: Build & Test vDef + Darcy Flow
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  compile:
    name: Build + Terzaghi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc g++ gfortran openmpi-bin libopenmpi-dev \
            cmake make perl m4 git patch wget curl dos2unix \
            libtool automake
      - name: Fix CRLF + permissions
        run: |
          find . -type f -name "*.sh" -exec dos2unix -q {} \;
          find . -type f -name "Makefile" -exec dos2unix -q {} \;
          find . -type f -name "*.F90" -exec dos2unix -q {} \;
          find . -type f -name "*.inc" -exec dos2unix -q {} \;
          find . -type f -name "*.h" -exec dos2unix -q {} \;
          chmod +x bin/makeversion.sh
      - name: Patch sources + Makefile (one-shot)
        run: |
          set -e
          echo "===== PATCH STEP ====="
          echo ""
          echo "--- FlowAssembly.F90 header state BEFORE patch ---"
          grep -n '#include\|Use m_MEF90_DefMechCtx' m_Flow/m_MEF90_FlowAssembly.F90
          echo ""
          echo "--- Flow.F90 header state BEFORE patch ---"
          grep -n '#include\|Use m_MEF90_DefMechCtx' m_Flow/m_MEF90_Flow.F90
          echo ""
          echo "--- Makefile BEFORE patch (FC lines) ---"
          grep -n '\${FC}' m_Flow/Makefile
          echo ""
          # ============ m_MEF90_FlowAssembly.F90 patches ============
          # P1: Add petsctsdef.h after petscbagdef.h
          sed -i '/#include "finclude\/petscbagdef.h"/a #include "finclude/petsctsdef.h"' m_Flow/m_MEF90_FlowAssembly.F90
          # P2: IFunction — add dummySNES decl + replace PETSC_NULL_OBJECT
          sed -i '/Call MEF90FlowOperator(PETSC_NULL_OBJECT/i\      Type(SNES)                                         :: dummySNES' m_Flow/m_MEF90_FlowAssembly.F90
          sed -i 's/Call MEF90FlowOperator(PETSC_NULL_OBJECT/Call MEF90FlowOperator(dummySNES/' m_Flow/m_MEF90_FlowAssembly.F90
          # P3: IJacobian — add dummySNES decl + replace PETSC_NULL_OBJECT
          sed -i '/Call MEF90FlowBilinearForm(PETSC_NULL_OBJECT.*1.0_Kr/i\      Type(SNES)                                         :: dummySNES' m_Flow/m_MEF90_FlowAssembly.F90
          sed -i 's/Call MEF90FlowBilinearForm(PETSC_NULL_OBJECT,/Call MEF90FlowBilinearForm(dummySNES,/' m_Flow/m_MEF90_FlowAssembly.F90
          # P7: Rename param 'ts' → 'tsHandle' (Fortran case-insensitive clashes with Type(TS))
          sed -i 's/Subroutine MEF90FlowIFunction(ts,/Subroutine MEF90FlowIFunction(tsHandle,/' m_Flow/m_MEF90_FlowAssembly.F90
          sed -i 's/Subroutine MEF90FlowIJacobian(ts,/Subroutine MEF90FlowIJacobian(tsHandle,/' m_Flow/m_MEF90_FlowAssembly.F90
          sed -i 's/Type(TS),Intent(IN):: *ts$/Type(TS),Intent(IN) :: tsHandle/' m_Flow/m_MEF90_FlowAssembly.F90
          # ============ m_MEF90_Flow.F90 patches ============
          # P4: Add petsctsdef.h after petscdef.h
          sed -i '/#include "finclude\/petscdef.h"/a #include "finclude/petsctsdef.h"' m_Flow/m_MEF90_Flow.F90
          # P5: Fix wrong module name
          sed -i 's/Use m_MEF90_DefMechCtx\b/Use m_MEF90_DefMechCtx_Type/' m_Flow/m_MEF90_Flow.F90
          # P8: Rename param 'ts' → 'tsHandle' in wrapper + all 2D/3D dispatch calls
          sed -i 's/Subroutine MEF90FlowIFunction(ts,/Subroutine MEF90FlowIFunction(tsHandle,/' m_Flow/m_MEF90_Flow.F90
          sed -i 's/Subroutine MEF90FlowIJacobian(ts,/Subroutine MEF90FlowIJacobian(tsHandle,/' m_Flow/m_MEF90_Flow.F90
          sed -i 's/Type(TS),Intent(IN):: *ts$/Type(TS),Intent(IN) :: tsHandle/' m_Flow/m_MEF90_Flow.F90
          sed -i 's/Call MEF90FlowIFunction2D(ts,/Call MEF90FlowIFunction2D(tsHandle,/' m_Flow/m_MEF90_Flow.F90
          sed -i 's/Call MEF90FlowIFunction3D(ts,/Call MEF90FlowIFunction3D(tsHandle,/' m_Flow/m_MEF90_Flow.F90
          sed -i 's/Call MEF90FlowIJacobian2D(ts,/Call MEF90FlowIJacobian2D(tsHandle,/' m_Flow/m_MEF90_Flow.F90
          sed -i 's/Call MEF90FlowIJacobian3D(ts,/Call MEF90FlowIJacobian3D(tsHandle,/' m_Flow/m_MEF90_Flow.F90
          # ============ Makefile patches ============
          # P6: Remove leading '-' from FC lines so errors are visible
          sed -i 's/^-\(@.*\${FC}\)/\1/' m_Flow/Makefile
          sed -i 's/^-\(\${FC}\)/\1/' m_Flow/Makefile
          echo ""
          echo "--- FlowAssembly.F90 header state AFTER patch ---"
          grep -n '#include\|Use m_MEF90_DefMechCtx\|dummySNES' m_Flow/m_MEF90_FlowAssembly.F90
          echo ""
          echo "--- Flow.F90 header state AFTER patch ---"
          grep -n '#include\|Use m_MEF90_DefMechCtx' m_Flow/m_MEF90_Flow.F90
          echo ""
          echo "--- Makefile AFTER patch (FC lines) ---"
          grep -n '\${FC}' m_Flow/Makefile
          echo ""
          echo "===== PATCH DONE ====="
      - name: Build OpenMPI 3.1.3
        run: |
          set -e
          export MPI_HOME=$HOME/openmpi-3.1.3
          cd /tmp
          wget -q https://download.open-mpi.org/release/open-mpi/v3.1/openmpi-3.1.3.tar.gz
          tar xzf openmpi-3.1.3.tar.gz
          cd openmpi-3.1.3
          ./configure --prefix=$MPI_HOME 2>&1 | tail -3
          make -j2 2>&1 | tail -3
          make install 2>&1 | tail -3
          export PATH=$MPI_HOME/bin:$PATH
          mpirun --version
      - name: Pre-download PETSc deps
        run: |
          set -e
          mkdir -p $HOME/petsc-dl && cd $HOME/petsc-dl
          wget -q https://github.com/HDFGroup/hdf5/archive/refs/tags/hdf5-1_10_6.tar.gz -O hdf5-1.10.6.tar.gz
          wget -q https://github.com/Unidata/netcdf-c/archive/refs/tags/v4.8.1.tar.gz -O netcdf-v4.8.1.tar.gz
          wget -q https://github.com/sandialabs/seacas/archive/refs/tags/v2021-01-20.tar.gz -O exodusii-2021-01-20.tar.gz
          ls -la
      - name: Build PETSc-3.3
        run: |
          set -e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PATH
          echo "=== Python 2.7 ==="
          wget -q https://repo.anaconda.com/miniconda/Miniconda2-latest-Linux-x86_64.sh -O /tmp/miniconda.sh
          bash /tmp/miniconda.sh -b -p $HOME/miniconda2
          $HOME/miniconda2/bin/conda create -n py27 python=2.7 -y -q
          export PY27=$HOME/miniconda2/envs/py27/bin/python
          $PY27 --version
          echo "=== Clone PETSc mef90-3.3 ==="
          git clone --single-branch --branch mef90-3.3 https://gitlab.com/blaisebourdin/petsc.git $PETSC_DIR
          cd $PETSC_DIR
          echo "=== Configure ==="
          $PY27 ./configure \
            COPTFLAGS='-O3' CXXOPTFLAGS='-O3' FOPTFLAGS='-O3' \
            FFLAGS='-Wno-aliasing -ffree-line-length-none' \
            --download-hdf5=$HOME/petsc-dl/hdf5-1.10.6.tar.gz \
            --download-netcdf=$HOME/petsc-dl/netcdf-v4.8.1.tar.gz \
            --download-exodusii=$HOME/petsc-dl/exodusii-2021-01-20.tar.gz \
            --download-f-blas-lapack=1 \
            --download-chaco=1 --download-hypre=1 --download-metis=1 \
            --download-ml=1 --download-parmetis=1 --download-sowing=1 \
            --download-yaml=1 --download-boost=1 \
            --with-mpi-dir=$MPI_HOME --with-sieve=1 \
            --with-fortran-datatypes=1 --with-debugging=0 \
            --with-clanguage=C++ --with-shared-libraries=1 \
            --with-c2html=0 --with-x11=0 --with-gnu-compilers=1 2>&1 | tail -20
          echo "=== Check config result ==="
          ls $PETSC_ARCH/conf/petscrules 2>&1 || echo "!! NO petscrules !!"
          echo "=== Make PETSc ==="
          make PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH all 2>&1 | tail -10
      - name: Build MEF90 + m_Flow + vDef
        run: |
          set +e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          export MEF90_DIR=$(pwd)
          echo "=== ENV ==="
          echo "MEF90_DIR=$MEF90_DIR"
          echo "PETSC_DIR=$PETSC_DIR"
          echo "PETSC_ARCH=$PETSC_ARCH"
          ls $PETSC_DIR/conf/variables
          ls bin/makeversion.sh

          echo ""
          echo "=== 0) CLEAN stale m_Flow artifacts ==="
          rm -rf objs/${PETSC_ARCH}/m_MEF90_Flow*.o objs/${PETSC_ARCH}/m_mef90_flow*.mod
          ls -la objs/${PETSC_ARCH}/m_MEF90_Flow* objs/${PETSC_ARCH}/m_mef90_flow* 2>&1 || echo "  (all cleaned)"

          echo ""
          echo "=== 1) BUILD MEF90 (core) ==="
          make MEF90 2>&1 | tail -3

          echo ""
          echo "=== 2) BUILD m_DefMech ==="
          make m_DefMech 2>&1 | tail -3

          echo ""
          echo "=== 3) BUILD m_HeatXfer ==="
          make m_HeatXfer 2>&1 | tail -3

          # ============================================================
          #  PREPROCESSOR DIAGNOSTIC — check if Type(TS) survives -E
          # ============================================================
          echo ""
          echo "=== 4) DIAGNOSTIC: gfortran -E FlowAssembly.F90 ==="
          FC_INCLUDES="-I${PETSC_DIR}/include -I${PETSC_DIR}/${PETSC_ARCH}/include -I${MEF90_DIR}/MEF90"
          echo "--- -DMEF90_DIM=3: does 'Type(TS)' survive preprocessing? ---"
          gfortran -E -DMEF90_DIM=3 $FC_INCLUDES m_Flow/m_MEF90_FlowAssembly.F90 > /tmp/assemble3D.i 2>&1
          echo "  preproc RC=$?, lines=$(wc -l < /tmp/assemble3D.i)"
          echo "  grep 'Type(TS)': $(grep -c 'Type(TS)' /tmp/assemble3D.i)"
          echo "  grep 'Type(SNES)': $(grep -c 'Type(SNES)' /tmp/assemble3D.i)"
          echo "  grep 'Type(DM)': $(grep -c 'Type(DM)' /tmp/assemble3D.i)"
          echo "  grep 'Type(SectionReal)': $(grep -c 'Type(SectionReal)' /tmp/assemble3D.i)"
          echo "--- -DMEF90_DIM=2: same check ---"
          gfortran -E -DMEF90_DIM=2 $FC_INCLUDES m_Flow/m_MEF90_FlowAssembly.F90 > /tmp/assemble2D.i 2>&1
          echo "  preproc RC=$?, lines=$(wc -l < /tmp/assemble2D.i)"
          echo "  grep 'Type(TS)': $(grep -c 'Type(TS)' /tmp/assemble2D.i)"
          echo "  grep 'Type(SNES)': $(grep -c 'Type(SNES)' /tmp/assemble2D.i)"
          echo "  grep 'Type(DM)': $(grep -c 'Type(DM)' /tmp/assemble2D.i)"
          echo ""
          echo "--- Sample TS lines from -DMEF90_DIM=3 preprocessed output ---"
          grep -n 'Type(TS)' /tmp/assemble3D.i | head -5 || echo "  !! NO Type(TS) FOUND — petsctsdef.h not included !!"
          echo ""
          echo "--- Sample SNES lines from -DMEF90_DIM=3 ---"
          grep -n 'Type(SNES)' /tmp/assemble3D.i | head -5

          # ============================================================
          #  ACTUAL m_Flow BUILD — FULL LOG, NO TRUNCATION
          # ============================================================
          echo ""
          echo "=== 5) BUILD m_Flow (FULL LOG to /tmp/flow.log) ==="
          make m_Flow > /tmp/flow.log 2>&1
          FLOW_RC=$?
          echo "m_Flow exit code: $FLOW_RC"
          echo ""
          echo "=== /tmp/flow.log (COMPLETE, NO TAIL) ==="
          cat /tmp/flow.log
          echo ""
          echo "=== ERROR SUMMARY (grep of flow.log) ==="
          grep -n -iE "error|fatal|undefined|no implicit|cannot open|does not exist|not found" /tmp/flow.log || echo "  (no error matches — great!)"

          echo ""
          echo "=== 6) OBJS STATE after m_Flow ==="
          ls -la objs/${PETSC_ARCH}/m_MEF90_Flow* 2>&1 || echo "  (no Flow .o files)"
          ls -la objs/${PETSC_ARCH}/m_mef90_flow* 2>&1 || echo "  (no Flow .mod files)"

          # ============================================================
          #  vDef (only if m_Flow succeeded)
          # ============================================================
          echo ""
          echo "=== 7) BUILD vDef ==="
          if [ $FLOW_RC -eq 0 ]; then
            make vDef 2>&1 | tee /tmp/vdef.log | tail -20
            echo "=== vDef binary ==="
            ls -la bin/$PETSC_ARCH/vDef 2>&1 || echo "  (vDef not found)"
          else
            echo "  SKIPPED — m_Flow failed (exit $FLOW_RC)"
          fi
      - name: Run Terzaghi
        if: always()
        run: |
          set +e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          export MEF90_DIR=$(pwd)
          cd vDef
          mpirun --allow-run-as-root -np 2 ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D.yaml 2>&1 | tee /tmp/terzaghi.log
          ls -la terzaghi1D-*.exo 2>/dev/null || echo "(no exo)"
        continue-on-error: true
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics
          path: |
            /tmp/flow.log
            /tmp/assemble3D.i
            /tmp/assemble2D.i
            /tmp/vdef.log
            /tmp/terzaghi.log
          retention-days: 7
