name: Build & Test vDef + Darcy Flow

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  compile:
    name: Build + Terzaghi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc g++ gfortran openmpi-bin libopenmpi-dev \
            cmake make perl m4 git patch wget curl dos2unix \
            libtool automake

      - name: PATCH ALL SOURCES (BEFORE BUILD!)
        run: |
          echo "===== STEP 1: CRLF + perms ====="
          find . -type f -name "*.sh" -exec dos2unix -q {} \;
          find . -type f -name "Makefile" -exec dos2unix -q {} \;
          find . -type f -name "*.F90" -exec dos2unix -q {} \;
          find . -type f -name "*.inc" -exec dos2unix -q {} \;
          find . -type f -name "*.h" -exec dos2unix -q {} \;
          chmod +x bin/makeversion.sh
          echo "CRLF done"
          echo ""
          echo "===== STEP 2: petscbagdef.h include ====="
          for f in m_Flow/m_MEF90_FlowCtx.F90 MEF90/m_MEF90_Materials.F90; do
            if ! grep -q 'petscbagdef.h' "$f"; then
              sed -i '/petscdef.h/a #include "finclude/petscbagdef.h"' "$f"
              echo "PATCHED: $f"
            else
              echo "OK: $f"
            fi
          done
          head -6 m_Flow/m_MEF90_FlowCtx.F90
          head -6 MEF90/m_MEF90_Materials.F90
          echo ""
          echo "===== STEP 3: Swap rules/variables include order ====="
          for mk in m_Flow/Makefile vDef/Makefile; do
            if grep -q 'conf/rules' "$mk"; then
              # Read all lines, swap the two includes
              sed -i '/conf\/rules/d' "$mk"
              sed -i '/conf\/variables/a include ${PETSC_DIR}/conf/rules' "$mk"
              echo "FIXED include order: $mk"
            fi
          done
          grep 'conf/' m_Flow/Makefile | head -3
          grep 'conf/' vDef/Makefile | head -3
          echo ""
          echo "===== STEP 4: vDef/Makefile add m_Flow/Makefile ====="
          if ! grep -q 'm_Flow/Makefile' vDef/Makefile; then
            sed -i '/m_DefMech\/Makefile.include/a include ${MEF90_DIR}/m_Flow/Makefile' vDef/Makefile
            echo "PATCHED vDef/Makefile"
          fi
          echo ""
          echo "===== STEP 5: Fix DefMechCtx.o dep ====="
          sed -i 's|m_DefMech\.o|m_MEF90_DefMechCtx.o|g' m_Flow/Makefile
          grep 'DefMech' m_Flow/Makefile
          echo ""
          echo "===== STEP 6: CRITICAL - Clear MEF90_DIM when re-entering MEF90 ====="
          # m_Flow/Makefile sets MEF90_DIM=2 on line 1, then does
          #   -@make -C ${MEF90_DIR} MEF90
          # This inherits MEF90_DIM=2 into MEF90 build → Materials.F90 compiles
          # with wrong flags → 2D/3D Type mismatch!
          # Fix: pass MEF90_DIM= (empty) on the re-enter
          sed -i 's|make -C ${MEF90_DIR} MEF90|make -C ${MEF90_DIR} MEF90 MEF90_DIM=|g' m_Flow/Makefile
          echo "BEFORE:"
          grep 'MEF90_DIR} MEF90' m_Flow/Makefile || grep 'MEF90' m_Flow/Makefile | head -5
          echo "AFTER:"
          grep 'MEF90_DIR} MEF90' m_Flow/Makefile || grep 'MEF90' m_Flow/Makefile | head -5
          echo ""
          echo "===== ALL PATCHES DONE ====="

      - name: Build OpenMPI 3.1.3
        run: |
          set -e
          export MPI_HOME=$HOME/openmpi-3.1.3
          cd /tmp
          wget -q https://download.open-mpi.org/release/open-mpi/v3.1/openmpi-3.1.3.tar.gz
          tar xzf openmpi-3.1.3.tar.gz
          cd openmpi-3.1.3
          ./configure --prefix=$MPI_HOME 2>&1 | tail -3
          make -j2 2>&1 | tail -3
          make install 2>&1 | tail -3
          export PATH=$MPI_HOME/bin:$PATH
          mpirun --version

      - name: Pre-download PETSc deps
        run: |
          set -e
          mkdir -p $HOME/petsc-dl && cd $HOME/petsc-dl
          wget -q https://github.com/HDFGroup/hdf5/archive/refs/tags/hdf5-1_10_6.tar.gz -O hdf5-1.10.6.tar.gz
          wget -q https://github.com/Unidata/netcdf-c/archive/refs/tags/v4.8.1.tar.gz -O netcdf-v4.8.1.tar.gz
          wget -q https://github.com/sandialabs/seacas/archive/refs/tags/v2021-01-20.tar.gz -O exodusii-2021-01-20.tar.gz

      - name: Build PETSc-3.3
        run: |
          set -e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PATH
          wget -q https://repo.anaconda.com/miniconda/Miniconda2-latest-Linux-x86_64.sh -O /tmp/miniconda.sh
          bash /tmp/miniconda.sh -b -p $HOME/miniconda2
          $HOME/miniconda2/bin/conda create -n py27 python=2.7 -y -q
          export PY27=$HOME/miniconda2/envs/py27/bin/python
          git clone --single-branch --branch mef90-3.3 https://gitlab.com/blaisebourdin/petsc.git $PETSC_DIR
          cd $PETSC_DIR
          $PY27 ./configure \
            COPTFLAGS='-O3' CXXOPTFLAGS='-O3' FOPTFLAGS='-O3' \
            FFLAGS='-Wno-aliasing -ffree-line-length-none' \
            --download-hdf5=$HOME/petsc-dl/hdf5-1.10.6.tar.gz \
            --download-netcdf=$HOME/petsc-dl/netcdf-v4.8.1.tar.gz \
            --download-exodusii=$HOME/petsc-dl/exodusii-2021-01-20.tar.gz \
            --download-f-blas-lapack=1 \
            --download-chaco=1 --download-hypre=1 --download-metis=1 \
            --download-ml=1 --download-parmetis=1 --download-sowing=1 \
            --download-yaml=1 --download-boost=1 \
            --with-mpi-dir=$MPI_HOME --with-sieve=1 \
            --with-fortran-datatypes=1 --with-debugging=0 \
            --with-clanguage=C++ --with-shared-libraries=1 \
            --with-c2html=0 --with-x11=0 --with-gnu-compilers=1 2>&1 | tail -5
          make PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH all 2>&1 | tail -5

      - name: BUILD ALL
        run: |
          set -e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          export MEF90_DIR=$(pwd)
          OBJDIR=objs/$PETSC_ARCH
          echo "===== MEF90 ====="
          make MEF90 2>&1 | tail -3
          echo "===== m_DefMech ====="
          make m_DefMech 2>&1 | tail -3
          echo "===== m_HeatXfer ====="
          make m_HeatXfer 2>&1 | tail -3
          echo "===== m_Flow ====="
          make m_Flow 2>&1 | tail -30
          echo "===== OBJDIR ====="
          ls $OBJDIR/m_MEF90_Flow*.o 2>/dev/null || echo "NO Flow.o!"
          ls $OBJDIR/m_mef90_flow*.mod 2>/dev/null || echo "NO Flow.mod!"
          echo "===== vDef ====="
          make vDef 2>&1 | tail -20
          echo "===== FINAL ====="
          ls -la bin/$PETSC_ARCH/vDef

      - name: Run Terzaghi
        if: always()
        run: |
          set +e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          export MEF90_DIR=$(pwd)
          cd vDef
          mpirun --allow-run-as-root -np 2 ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D.yaml 2>&1 | tee /tmp/terzaghi.log
          ls -la terzaghi1D-*.exo 2>/dev/null || echo "(no exo)"
        continue-on-error: true
