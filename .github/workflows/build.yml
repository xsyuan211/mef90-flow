name: Build & Test vDef + Darcy Flow

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  compile:
    name: Build + Terzaghi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ gfortran openmpi-bin libopenmpi-dev cmake make perl m4 git patch wget curl dos2unix libtool automake python3

      - name: PATCH ALL SOURCES
        run: |
          set +e
          echo "===== CRLF ====="
          find . -type f $ -name "*.sh" -o -name "Makefile" -o -name "*.F90" -o -name "*.inc" -o -name "*.h" -o -name "*.yaml" -o -name "*.yml" $ -exec dos2unix -q {} \;
          chmod +x bin/makeversion.sh

          echo "===== REMOVE petscbagdef.h from FlowCtx ====="
          sed -i '/petscbagdef.h/d' m_Flow/m_MEF90_FlowCtx.F90
          echo "After sed:"
          head -8 m_Flow/m_MEF90_FlowCtx.F90

          echo "===== Swap include order ====="
          for f in m_Flow/Makefile vDef/Makefile; do
            echo "--- $f before ---"
            grep -n 'conf/' $f | head -3
            python3 -c "
import sys
p='$f'
with open(p) as fh: c=fh.read()
old='include \${PETSC_DIR}/conf/rules\ninclude \${PETSC_DIR}/conf/variables'
new='include \${PETSC_DIR}/conf/variables\ninclude \${PETSC_DIR}/conf/rules'
if old in c:
    c=c.replace(old,new)
    with open(p,'w') as fh: fh.write(c)
    print('SWAPPED')
else:
    print('NOT FOUND')
"
            echo "--- $f after ---"
            grep -n 'conf/' $f | head -3
          done

          echo "===== vDef: add m_Flow/Makefile ====="
          grep -q 'm_Flow/Makefile' vDef/Makefile || python3 -c "
p='vDef/Makefile'
with open(p) as fh: c=fh.read()
c=c.replace('include \${MEF90_DIR}/m_DefMech/Makefile.include','include \${MEF90_DIR}/m_DefMech/Makefile.include\ninclude \${MEF90_DIR}/m_Flow/Makefile')
with open(p,'w') as fh: fh.write(c)
print('ADDED')
"
          echo "--- vDef Makefile includes ---"
          grep -n 'Makefile' vDef/Makefile | head -8

          echo "===== m_Flow: clear MEF90_DIM ====="
          python3 -c "
import re
p='m_Flow/Makefile'
with open(p) as fh: c=fh.read()
c=re.sub(r'make -C \$\{MEF90_DIR\} MEF90 ','make -C \${MEF90_DIR} MEF90 MEF90_DIM= ',c)
with open(p,'w') as fh: fh.write(c)
print('DONE')
"
          echo "--- m_Flow make MEF90 lines ---"
          grep -n 'make.*MEF90' m_Flow/Makefile

      - name: Build OpenMPI 3.1.3
        run: |
          set -e
          export MPI_HOME=$HOME/openmpi-3.1.3
          cd /tmp
          wget -q https://download.open-mpi.org/release/open-mpi/v3.1/openmpi-3.1.3.tar.gz
          tar xzf openmpi-3.1.3.tar.gz
          cd openmpi-3.1.3
          ./configure --prefix=$MPI_HOME 2>&1 | tail -3
          make -j2 2>&1 | tail -3
          make install 2>&1 | tail -3
          export PATH=$MPI_HOME/bin:$PATH
          mpirun --version

      - name: Pre-download PETSc deps
        run: |
          set -e
          mkdir -p $HOME/petsc-dl && cd $HOME/petsc-dl
          wget -q https://github.com/HDFGroup/hdf5/archive/refs/tags/hdf5-1_10_6.tar.gz -O hdf5-1.10.6.tar.gz
          wget -q https://github.com/Unidata/netcdf-c/archive/refs/tags/v4.8.1.tar.gz -O netcdf-v4.8.1.tar.gz
          wget -q https://github.com/sandialabs/seacas/archive/refs/tags/v2021-01-20.tar.gz -O exodusii-2021-01-20.tar.gz
          ls -la

      - name: Build PETSc-3.3
        run: |
          set -e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PATH
          echo "=== Miniconda2 + py27 ==="
          wget -q https://repo.anaconda.com/miniconda/Miniconda2-latest-Linux-x86_64.sh -O /tmp/miniconda.sh
          bash /tmp/miniconda.sh -b -p $HOME/miniconda2
          $HOME/miniconda2/bin/conda create -n py27 python=2.7 -y -q
          export PATH=$HOME/miniconda2/envs/py27/bin:$PATH
          which python
          python --version
          echo "=== Clone PETSc ==="
          git clone --single-branch --branch mef90-3.3 https://gitlab.com/blaisebourdin/petsc.git $PETSC_DIR
          cd $PETSC_DIR
          echo "=== Configure ==="
          python ./configure COPTFLAGS='-O3' CXXOPTFLAGS='-O3' FOPTFLAGS='-O3' FFLAGS='-Wno-aliasing -ffree-line-length-none' --download-hdf5=$HOME/petsc-dl/hdf5-1.10.6.tar.gz --download-netcdf=$HOME/petsc-dl/netcdf-v4.8.1.tar.gz --download-exodusii=$HOME/petsc-dl/exodusii-2021-01-20.tar.gz --download-f-blas-lapack=1 --download-chaco=1 --download-hypre=1 --download-metis=1 --download-ml=1 --download-parmetis=1 --download-sowing=1 --download-yaml=1 --download-boost=1 --with-mpi-dir=$MPI_HOME --with-sieve=1 --with-fortran-datatypes=1 --with-debugging=0 --with-clanguage=C++ --with-shared-libraries=1 --with-c2html=0 --with-x11=0 --with-gnu-compilers=1 2>&1 | tee /tmp/petsc-configure.log | tail -30
          echo "=== Verify petscrules ==="
          test -f $PETSC_ARCH/conf/petscrules
          ls -la $PETSC_ARCH/conf/petscrules
          echo "=== Make PETSc ==="
          make PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH all 2>&1 | tail -10

      - name: Build ALL
        run: |
          set -e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          export MEF90_DIR=$(pwd)
          echo "ENV: MEF90_DIR=$MEF90_DIR PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH"
          echo "--- MEF90 ---"
          make MEF90
          echo "--- DefMech ---"
          make m_DefMech
          echo "--- HeatXfer ---"
          make m_HeatXfer
          echo "--- m_Flow ---"
          make m_Flow 2>&1 | tee /tmp/m_flow.log
          echo "--- vDef ---"
          make vDef
          echo "--- BIN ---"
          ls -la bin/$PETSC_ARCH/vDef
          echo "=== BUILD SUCCESS ==="

      - name: Run Terzaghi
        if: always()
        run: |
          set +e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          export MEF90_DIR=$(pwd)
          cd vDef
          mpirun --allow-run-as-root -np 2 ../bin/$PETSC_ARCH/vDef -prefix data/Beam1x10-tri3 -options_file_yaml data/terzaghi1D.yaml 2>&1 | tee /tmp/terzaghi.log
          ls -la terzaghi1D-*.exo 2>/dev/null || echo "(no exo)"
        continue-on-error: true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            /tmp/petsc-configure.log
            /tmp/m_flow.log
            /tmp/terzaghi.log
          retention-days: 7
