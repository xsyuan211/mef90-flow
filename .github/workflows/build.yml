name: Build & Test vDef + Darcy Flow

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  compile:
    name: Build + Terzaghi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc g++ gfortran openmpi-bin libopenmpi-dev \
            cmake make perl m4 git patch wget curl dos2unix \
            libtool automake

      - name: PATCH ALL SOURCES (CRITICAL)
        run: |
          set +e
          echo "===== STEP 1: CRLF → LF + permissions ====="
          find . -type f -name "*.sh" -exec dos2unix -q {} \;
          find . -type f -name "Makefile" -exec dos2unix -q {} \;
          find . -type f -name "*.F90" -exec dos2unix -q {} \;
          find . -type f -name "*.inc" -exec dos2unix -q {} \;
          find . -type f -name "*.h" -exec dos2unix -q {} \;
          find . -type f -name "*.yaml" -exec dos2unix -q {} \;
          find . -type f -name "*.yml" -exec dos2unix -q {} \;
          chmod +x bin/makeversion.sh
          echo ""

          echo "===== STEP 2: REMOVE petscbagdef.h from FlowCtx main module ====="
          echo "--- BEFORE (grep petscbagdef.h) ---"
          grep -n 'petscbagdef.h' m_Flow/m_MEF90_FlowCtx.F90
          sed -i '/petscbagdef.h/d' m_Flow/m_MEF90_FlowCtx.F90
          echo "--- AFTER ---"
          grep -n 'petscbagdef.h' m_Flow/m_MEF90_FlowCtx.F90 || echo "CLEAN - no petscbagdef.h remaining!"
          echo "--- Header now ---"
          head -10 m_Flow/m_MEF90_FlowCtx.F90
          echo ""

          echo "===== STEP 3: Swap include order in Makefiles ====="
          for mk in m_Flow/Makefile vDef/Makefile; do
            echo "--- $mk BEFORE ---"
            grep -n 'conf/' "$mk" | head -5
            # Swap: variables before rules
            sed -i 's|include ${PETSC_DIR}/conf/rules\ninclude ${PETSC_DIR}/conf/variables|include ${PETSC_DIR}/conf/variables\ninclude ${PETSC_DIR}/conf/rules|g' "$mk"
            sed -i '/conf\/rules/,/conf\/variables/{
              /conf\/rules/{h;d}
              /conf\/variables/{p;x}
            }' "$mk"
            echo "--- $mk AFTER ---"
            grep -n 'conf/' "$mk" | head -5
          done
          echo ""

          echo "===== STEP 4: Add m_Flow/Makefile include to vDef/Makefile ====="
          if ! grep -q 'm_Flow/Makefile' vDef/Makefile; then
            sed -i '/m_DefMech\/Makefile.include/a include ${MEF90_DIR}/m_Flow/Makefile' vDef/Makefile
          fi
          grep -n 'Makefile' vDef/Makefile | head -10
          echo ""

          echo "===== STEP 5: Clear MEF90_DIM in m_Flow/Makefile ====="
          echo "--- BEFORE ---"
          grep -n 'make.*MEF90' m_Flow/Makefile
          sed -i 's|make -C ${MEF90_DIR} MEF90$.*$|make -C ${MEF90_DIR} MEF90 MEF90_DIM=\1|g' m_Flow/Makefile
          # Simpler: just add MEF90_DIM= after MEF90 in the inner call
          sed -i '/make -C ${MEF90_DIR} MEF90 /s/MEF90 /MEF90 MEF90_DIM= /g' m_Flow/Makefile
          echo "--- AFTER ---"
          grep -n 'make.*MEF90' m_Flow/Makefile
          echo ""

          echo "===== ALL PATCHES VERIFIED ====="

      - name: Build OpenMPI 3.1.3
        run: |
          set -e
          export MPI_HOME=$HOME/openmpi-3.1.3
          cd /tmp
          wget -q https://download.open-mpi.org/release/open-mpi/v3.1/openmpi-3.1.3.tar.gz
          tar xzf openmpi-3.1.3.tar.gz
          cd openmpi-3.1.3
          ./configure --prefix=$MPI_HOME 2>&1 | tail -3
          make -j2 2>&1 | tail -3
          make install 2>&1 | tail -3
          export PATH=$MPI_HOME/bin:$PATH
          mpirun --version

      - name: Pre-download PETSc deps
        run: |
          set -e
          mkdir -p $HOME/petsc-dl && cd $HOME/petsc-dl
          wget -q https://github.com/HDFGroup/hdf5/archive/refs/tags/hdf5-1_10_6.tar.gz -O hdf5-1.10.6.tar.gz
          wget -q https://github.com/Unidata/netcdf-c/archive/refs/tags/v4.8.1.tar.gz -O netcdf-v4.8.1.tar.gz
          wget -q https://github.com/sandialabs/seacas/archive/refs/tags/v2021-01-20.tar.gz -O exodusii-2021-01-20.tar.gz
          ls -la

      - name: Build PETSc-3.3
        run: |
          set -e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PATH
          echo "=== Python 2.7 ==="
          wget -q https://repo.anaconda.com/miniconda/Miniconda2-latest-Linux-x86_64.sh -O /tmp/miniconda.sh
          bash /tmp/miniconda.sh -b -p $HOME/miniconda2
          $HOME/miniconda2/bin/conda create -n py27 python=2.7 -y -q
          export PY27=$HOME/miniconda2/envs/py27/bin/python
          echo "PY27=$PY27"
          ls -la $PY27
          $PY27 --version
          # CRITICAL: Make sure python2.7 is BEFORE python3 in PATH!
          ln -sf $PY27 /usr/local/bin/python2.7
          ln -sf $PY27 /usr/local/bin/python2
          export PATH=$HOME/miniconda2/envs/py27/bin:$PATH
          which python
          python --version
          echo "=== Clone PETSc mef90-3.3 ==="
          git clone --single-branch --branch mef90-3.3 https://gitlab.com/blaisebourdin/petsc.git $PETSC_DIR
          cd $PETSC_DIR
          echo "=== Configure ==="
          python2.7 ./configure \
            COPTFLAGS='-O3' CXXOPTFLAGS='-O3' FOPTFLAGS='-O3' \
            FFLAGS='-Wno-aliasing -ffree-line-length-none' \
            --download-hdf5=$HOME/petsc-dl/hdf5-1.10.6.tar.gz \
            --download-netcdf=$HOME/petsc-dl/netcdf-v4.8.1.tar.gz \
            --download-exodusii=$HOME/petsc-dl/exodusii-2021-01-20.tar.gz \
            --download-f-blas-lapack=1 \
            --download-chaco=1 --download-hypre=1 --download-metis=1 \
            --download-ml=1 --download-parmetis=1 --download-sowing=1 \
            --download-yaml=1 --download-boost=1 \
            --with-mpi-dir=$MPI_HOME --with-sieve=1 \
            --with-fortran-datatypes=1 --with-debugging=0 \
            --with-clanguage=C++ --with-shared-libraries=1 \
            --with-c2html=0 --with-x11=0 --with-gnu-compilers=1 2>&1 | tee /tmp/petsc-configure.log | tail -30
          echo "=== Configure exit code: $? ==="
          echo "=== Check petscrules ==="
          ls -la $PETSC_ARCH/conf/petscrules 2>/dev/null || echo "FAILURE: petscrules NOT created!"
          echo "=== If failed, show last 30 of configure log ==="
          if [ ! -f "$PETSC_ARCH/conf/petscrules" ]; then tail -30 /tmp/petsc-configure.log; exit 1; fi
          echo "=== Make PETSc ==="
          make PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH all 2>&1 | tail -10

      - name: Build ALL (no tail - show full errors!)
        run: |
          set -e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          export MEF90_DIR=$(pwd)
          echo ""
          echo "========================================"
          echo "  ENV CHECK"
          echo "========================================"
          echo "MEF90_DIR=$MEF90_DIR"
          echo "PETSC_DIR=$PETSC_DIR"
          echo "PETSC_ARCH=$PETSC_ARCH"
          ls $PETSC_DIR/conf/variables
          ls $PETSC_ARCH/conf/petscrules
          echo ""

          echo "========================================"
          echo "  BUILD 1: MEF90"
          echo "========================================"
          make MEF90 2>&1
          echo "--- MEF90 OK ---"
          echo ""

          echo "========================================"
          echo "  BUILD 2: m_DefMech"
          echo "========================================"
          make m_DefMech 2>&1
          echo "--- DefMech OK ---"
          echo ""

          echo "========================================"
          echo "  BUILD 3: m_HeatXfer"
          echo "========================================"
          make m_HeatXfer 2>&1
          echo "--- HeatXfer OK ---"
          echo ""

          echo "========================================"
          echo "  BUILD 4: m_Flow (FULL OUTPUT)"
          echo "========================================"
          make m_Flow 2>&1
          echo "--- m_Flow OK ---"
          echo ""

          echo "========================================"
          echo "  BUILD 5: vDef"
          echo "========================================"
          make vDef 2>&1
          echo ""

          echo "========================================"
          echo "  FINAL CHECK"
          echo "========================================"
          ls -la bin/$PETSC_ARCH/vDef
          echo ""
          echo "========================================"
          echo "  BUILD SUCCESS!!!"
          echo "========================================"

      - name: Run Terzaghi benchmark
        if: always()
        run: |
          set +e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=$HOME/openmpi-3.1.3
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          export MEF90_DIR=$(pwd)
          cd vDef
          echo "=== Running Terzaghi 1D ==="
          mpirun --allow-run-as-root -np 2 ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D.yaml 2>&1 | tee /tmp/terzaghi.log
          echo ""
          echo "=== EXO files ==="
          ls -la terzaghi1D-*.exo 2>/dev/null || echo "(no exo generated)"
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-outputs
          path: |
            vDef/terzaghi1D-*.exo
            /tmp/terzaghi.log
          retention-days: 7
