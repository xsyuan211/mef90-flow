name: Build & Test vDef + Darcy Flow

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  compile:
    name: Build + Terzaghi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ gfortran openmpi-bin libopenmpi-dev cmake make perl m4 git patch wget curl python3-pip libboost-dev libhdf5-dev libnetcdf-dev
          pip3 install cython pyaml numpy

      - name: Build PETSc-3.3 (~30 min)
        run: |
          set -e
          export PETSC_DIR=$HOME/petsc-3.3-mef90
          export PETSC_ARCH=linux-gcc-openmpi-mef90-O
          export MPI_HOME=/usr/lib/x86_64-linux-gnu/openmpi
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          echo "=== Cloning PETSc-3.3-mef90 ==="
          git clone --single-branch --branch mef90-3.3 https://gitlab.com/blaisebourdin/petsc.git $PETSC_DIR
          cd $PETSC_DIR
          echo "=== Configuring PETSc ==="
          ./configure \
            COPTFLAGS='-O3' CXXOPTFLAGS='-O3' FOPTFLAGS='-O3' \
            FFLAGS='-Wno-aliasing -ffree-line-length-none' \
            CXXFLAGS='-Wno-unused-variable' CFLAGS='-Wno-unused-variable' \
            --download-exodusii=1 --download-f-blas-lapack=1 \
            --download-chaco=1 --download-hypre=1 --download-metis=1 --download-ml=1 \
            --download-netcdf=1 --download-parmetis=1 --download-sowing=1 --download-yaml=1 \
            --with-boost=1 --with-clanguage=C++ --with-debugging=0 \
            --with-fortran-datatypes=1 --with-gnu-compilers=1 \
            --with-mpi-dir=$MPI_HOME --with-shared-libraries=1 \
            --with-sieve=1 --with-c2html=0 --with-x11=0 2>&1 | tail -30
          echo "=== Building PETSc ==="
          make PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH all 2>&1 | tail -20
          echo "=== PETSc OK ==="
          ls $PETSC_DIR/lib/$PETSC_ARCH/libpetsc*

      - name: Build mef90 + m_Flow + vDef
        env:
          MEF90_DIR: ${{ github.workspace }}
          PETSC_DIR: $HOME/petsc-3.3-mef90
          PETSC_ARCH: linux-gcc-openmpi-mef90-O
          MPI_HOME: /usr/lib/x86_64-linux-gnu/openmpi
        run: |
          set -e
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          echo "MEF90_DIR=$MEF90_DIR"
          echo "PWD=$(pwd)"
          ls
          echo ""
          echo "=== Compiling MEF90 ==="
          make MEF90 2>&1 | tail -15
          echo ""
          echo "=== Compiling m_DefMech ==="
          make m_DefMech 2>&1 | tail -10
          echo ""
          echo "=== Compiling m_HeatXfer ==="
          make m_HeatXfer 2>&1 | tail -10
          echo ""
          echo "=== Compiling m_Flow ==="
          make m_Flow 2>&1 | tail -40
          echo ""
          echo "=== Compiling vDef ==="
          make vDef 2>&1 | tail -20
          echo ""
          echo "=== Build complete! ==="
          ls -la bin/$PETSC_ARCH/vDef

      - name: Run Terzaghi 1D benchmark
        if: always()
        env:
          PETSC_DIR: $HOME/petsc-3.3-mef90
          PETSC_ARCH: linux-gcc-openmpi-mef90-O
          MPI_HOME: /usr/lib/x86_64-linux-gnu/openmpi
        run: |
          set +e
          export PATH=$MPI_HOME/bin:$PETSC_DIR/bin:$PETSC_DIR/$PETSC_ARCH/bin:$PATH
          cd vDef
          echo "=== Terzaghi 1D Consolidation ==="
          echo "k_min=5e-11 m^2, mu=1e-3 Pa-s, S=4.6e-10 1/Pa"
          echo "c_v ~ 109 m^2/s"
          echo ""
          mpirun --allow-run-as-root -np 2 ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D.yaml 2>&1 | tee /tmp/terzaghi.log
          echo ""
          echo "=== EXO outputs ==="
          ls -la terzaghi1D-*.exo 2>/dev/null || echo "(no exo generated)"
        continue-on-error: true

      - name: Upload EXO artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terzaghi-results
          path: |
            vDef/terzaghi1D-*.exo
            /tmp/terzaghi.log
          retention-days: 7
