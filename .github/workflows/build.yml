name: Build & Test vDef + Darcy Flow

on:
  push:
    branches: [main, master]
  workflow_dispatch:              # 手动触发

jobs:
  compile:
    name: Build + Terzaghi Benchmark
    runs-on: ubuntu-latest
    container:
      image: bourdin/mef90centos7openmpio:latest
      options: --cpus=4 --memory=8g
    steps:
      - name: Checkout mef90 source
        uses: actions/checkout@v4
        with:
          path: mef90-master

      - name: Build MEF90 + m_Flow + vDef
        working-directory: mef90-master
        env:
          MEF90_DIR: /__w/mef90-master/mef90-master
          # PETSc 路径 — Bourdin 镜像预置好的
          PETSC_DIR: /opt/HPC/petsc-3.3-mef90
          PETSC_ARCH: Linux-gcc9-mpich32-O
        run: |
          echo "=== Directory ==="
          pwd && ls -la
          echo ""
          echo "=== PETSc check ==="
          echo "PETSC_DIR=$PETSC_DIR"
          echo "PETSC_ARCH=$PETSC_ARCH"
          ls $PETSC_DIR/lib/$PETSC_ARCH/ 2>&1 | head -10
          echo ""
          echo "=== Compiling ==="
          make MEF90            2>&1 | tail -20
          make m_DefMech        2>&1 | tail -10
          make m_HeatXfer       2>&1 | tail -10
          make m_Flow           2>&1 | tail -30
          make vDef             2>&1 | tail -20
          echo ""
          echo "=== Build complete ==="
          ls -la bin/$PETSC_ARCH/vDef

      - name: Run Terzaghi 1D Consolidation Benchmark
        working-directory: mef90-master/vDef
        env:
          MEF90_DIR: /__w/mef90-master/mef90-master
          PETSC_DIR: /opt/HPC/petsc-3.3-mef90
          PETSC_ARCH: Linux-gcc9-mpich32-O
        run: |
          set -e
          echo "=== Running Terzaghi benchmark ==="
          echo "  k_min=5e-11 m^2, mu=1e-3 Pa-s, S=4.6e-10 1/Pa"
          echo "  c_v ~ 109 m^2/s, T_max = 1.09"
          echo ""

          mpirun --allow-run-as-root -np 2 \
            ../bin/$PETSC_ARCH/vDef \
            -prefix data/Beam1x10-tri3 \
            -options_file_yaml data/terzaghi1D.yaml \
            2>&1 | tee /tmp/terzaghi.log || echo "(solver non-zero exit, checking log)"

          echo ""
          echo "=== Output EXO files ==="
          ls -la terzaghi1D-*.exo 2>/dev/null || echo "(no exo - solver may have exited early)"
          echo ""
          echo "=== Terzaghi Analytical Reference ==="
          echo "  T(t) = c_v*t/H^2 = 1.09*t"
          echo "  t=0.5s -> T=0.54 -> consolidation ~ 42%"
          echo "  t=1.0s -> T=1.09 -> consolidation ~ 63%"

      - name: Upload EXO outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terzaghi-results
          path: mef90-master/vDef/terzaghi1D-*.exo
          retention-days: 7
